<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แก้ไขหนังสือ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>📝 แก้ไขหนังสือ</h2>
        <form id="editForm">
            <div class="form-group">
                <label>ID:</label>
                <input type="text" id="id" disabled>
            </div>
            <div class="form-group">
                <label>ชื่อหนังสือ:</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label>ผู้แต่ง:</label>
                <input type="text" id="author" required>
            </div>
            <div class="form-group">
                <label>หมวดหมู่:</label>
                <input type="text" id="category" required>
            </div>
            <div class="form-group">
                <label>ราคา:</label>
                <input type="number" step="0.01" id="price" required>
            </div>
            <div class="form-group">
                <label>จำนวนในสต็อก:</label>
                <input type="number" id="stock" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-edit">อัปเดต</button>
                <a href="index.html" class="btn btn-cancel">ยกเลิก</a>
            </div>
        </form>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api/books';
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id');

        fetch(API_BASE + '/' + bookId)
            .then(res => res.json())
            .then(book => {
                document.getElementById('id').value = book.id;
                document.getElementById('title').value = book.title;
                document.getElementById('author').value = book.author;
                document.getElementById('category').value = book.category;
                document.getElementById('price').value = book.price;
                document.getElementById('stock').value = book.stock;
            });

        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const bookData = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                stock: document.getElementById('stock').value
            };

            fetch(API_BASE + '/edit/' + bookId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookData)
            })
            .then(res => res.json())
            .then(() => window.location.href = 'index.html');
        });
    </script>
</body>
</html>
