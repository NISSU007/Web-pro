<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เพิ่มหนังสือใหม่</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>📗 เพิ่มหนังสือใหม่</h2>
        <form id="addForm">
            <div class="form-group">
                <label>ID:</label>
                <input type="text" id="id" placeholder="เช่น B010" required>
            </div>
            <div class="form-group">
                <label>ชื่อหนังสือ:</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label>ผู้แต่ง:</label>
                <input type="text" id="author" required>
            </div>
            <div class="form-group">
                <label>หมวดหมู่:</label>
                <input type="text" id="category" required>
            </div>
            <div class="form-group">
                <label>ราคา:</label>
                <input type="number" step="0.01" id="price" required>
            </div>
            <div class="form-group">
                <label>จำนวนในสต็อก:</label>
                <input type="number" id="stock" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-add">บันทึก</button>
                <a href="index.html" class="btn btn-cancel">ยกเลิก</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const bookData = {
                id: document.getElementById('id').value,
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                stock: document.getElementById('stock').value
            };

            fetch('http://localhost:3000/api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookData)
            })
            .then(res => res.json())
            .then(() => window.location.href = 'index.html');
        });
    </script>
</body>
</html>
